<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — GTU R&D &amp; IIC Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="portal-watermark"></div>
    <div class="auth-card">
      <div class="auth-card__logo">
        <div class="auth-card__logo-icon" style="background: transparent;">
          <img src="{{ url_for('static', filename='logo.png') }}" alt="IIC Logo" class="brand-logo-img">
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to your R&D &amp; IIC Portal</p>
      </div>

      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div style="padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:0.875rem;
          {% if category == 'error' or category == 'danger' %}
            background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);
          {% elif category == 'success' %}
            background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);
          {% else %}
            background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.3);
          {% endif %}
        ">{{ message }}</div>
      {% endfor %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@gtu.edu.in" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required style="padding-right: 40px;">
            <button type="button" onclick="togglePassword(this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #a0aec0; display: flex; align-items: center; justify-content: center; padding: 0;">
              <i data-lucide="eye" style="width: 20px; height: 20px;"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between mb-6">
          <label class="form-check">
            <input type="checkbox" name="remember" value="1">
            <span>Remember me</span>
          </label>
          <a href="#" style="font-size:0.8rem;color:var(--gold)">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--gold btn--lg btn--block" style="font-size:1rem;">
          <i data-lucide="log-in" style="width:18px;height:18px"></i>
          Sign In
        </button>
      </form>



    </div>
  </div>

  <script>
    lucide.createIcons();

    function togglePassword(btn) {
      const container = btn.parentElement;
      const input = container.querySelector('input');
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off" style="width: 20px; height: 20px;"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye" style="width: 20px; height: 20px;"></i>';
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
