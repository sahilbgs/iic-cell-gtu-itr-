<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — GTU R&D &amp; IIC Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo">
        <div class="auth-card__logo-icon">GTU</div>
        <h2>Welcome Back</h2>
        <p>Sign in to your R&D &amp; IIC Portal</p>
      </div>

      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div style="padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:0.875rem;
          {% if category == 'error' or category == 'danger' %}
            background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);
          {% elif category == 'success' %}
            background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);
          {% else %}
            background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.3);
          {% endif %}
        ">{{ message }}</div>
      {% endfor %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@gtu.edu.in" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="flex items-center justify-between mb-6">
          <label class="form-check">
            <input type="checkbox" name="remember" value="1">
            <span>Remember me</span>
          </label>
          <a href="#" style="font-size:0.8rem;color:var(--gold)">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--gold btn--lg btn--block" style="font-size:1rem;">
          <i data-lucide="log-in" style="width:18px;height:18px"></i>
          Sign In
        </button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:.8rem;color:rgba(255,255,255,.45);">
        Don't have an account? <a href="{{ url_for('auth.register') }}" style="color:var(--gold);font-weight:600">Register</a>
      </p>

      <!-- Classy Demo Credentials Component -->
      <div style="margin-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.25rem;">
        <style>
          .demo-btn {
            text-align: left;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all var(--transition-fast);
            display: block;
            width: 100%;
          }
          .demo-btn:hover {
            background: rgba(255, 215, 0, 0.1) !important;
            border-color: var(--gold) !important;
            transform: translateY(-1px);
          }
          .demo-btn strong {
            color: var(--gold);
            font-weight: 600;
          }
          .demo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
          }
          details[open] .chevron-icon {
            transform: rotate(180deg);
          }
          .chevron-icon {
            transition: transform var(--transition-fast);
          }
        </style>
        
        <details style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: var(--border-radius); padding: 10px 14px;">
          <summary style="font-size: 0.8rem; color: #fff; font-weight: 600; list-style: none; display: flex; align-items: center; justify-content: space-between; outline: none; cursor: pointer;">
            <span style="display: flex; align-items: center; gap: 8px;">
              <i data-lucide="key-round" style="width: 14px; height: 14px; color: var(--gold);"></i>
              Quick Demo Accounts (Click to Fill)
            </span>
            <i data-lucide="chevron-down" style="width: 14px; height: 14px;" class="chevron-icon"></i>
          </summary>
          
          <div class="demo-grid">
            <button type="button" class="demo-btn" onclick="fillDemo('principal@gtu.ac.in')">
              <strong>Principal</strong><br>
              <span style="opacity: 0.6; font-size: 0.7rem;">principal@gtu.ac.in</span>
            </button>
            <button type="button" class="demo-btn" onclick="fillDemo('chairperson@gtu.ac.in')">
              <strong>IIC Chair</strong><br>
              <span style="opacity: 0.6; font-size: 0.7rem;">chairperson@gtu.ac.in</span>
            </button>
            <button type="button" class="demo-btn" onclick="fillDemo('rdcoord@gtu.ac.in')">
              <strong>R&D Coord</strong><br>
              <span style="opacity: 0.6; font-size: 0.7rem;">rdcoord@gtu.ac.in</span>
            </button>
            <button type="button" class="demo-btn" onclick="fillDemo('faculty.ce@gtu.ac.in')">
              <strong>CE Faculty</strong><br>
              <span style="opacity: 0.6; font-size: 0.7rem;">faculty.ce@gtu.ac.in</span>
            </button>
          </div>
          
          <div style="text-align: center; margin-top: 10px; font-size: 0.75rem; color: rgba(255,255,255,0.5);">
            Default Password: <code style="color: var(--gold); background: rgba(0,0,0,0.25); padding: 2px 6px; border-radius: 4px; font-weight: 600;">password123</code>
          </div>
        </details>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    function fillDemo(email) {
      const emailField = document.getElementById('email');
      const passField = document.getElementById('password');
      
      emailField.value = email;
      passField.value = 'password123';
      
      // Flash inputs to give instant visual feedback
      emailField.style.borderColor = 'var(--gold)';
      passField.style.borderColor = 'var(--gold)';
      emailField.style.boxShadow = '0 0 0 3px rgba(255, 215, 0, 0.25)';
      passField.style.boxShadow = '0 0 0 3px rgba(255, 215, 0, 0.25)';
      
      setTimeout(() => {
        emailField.style.borderColor = '';
        passField.style.borderColor = '';
        emailField.style.boxShadow = '';
        passField.style.boxShadow = '';
      }, 600);
    }
  </script>
</body>
</html>
