{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}
{% block page_title %}Not Found{% endblock %}

{% block content %}
<div class="text-center py-20 max-w-md mx-auto">
  <i data-lucide="alert-octagon" style="width:64px;height:64px;color:var(--warning);margin:0 auto 16px"></i>
  <h2 class="mb-2">Page Not Found</h2>
  <p class="text-secondary mb-6">The page resource link you followed might have expired, or the endpoint URL was entered incorrectly.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn--primary">Return to Dashboard</a>
</div>
{% endblock %}
